def versionSources = [
    '1.21.1':  ['1.21.1', '1.21.1-26.1.2', '1.21.1-26.2'],
    '1.21.10': ['1.21.10', '1.21.10-1.21.11', '1.21.10-26.3', '1.21.1-26.1.2', '1.21.1-26.2'],
    '1.21.11': ['1.21.11', '1.21.10-1.21.11', '1.21.10-26.3', '1.21.11-26.3', '1.21.1-26.1.2', '1.21.1-26.2'],
    '26.1':    ['26.1-26.1.2', '26.1-26.3', '1.21.10-26.3', '1.21.11-26.3', '1.21.1-26.1.2', '1.21.1-26.2'],
    '26.1.2':  ['26.1-26.1.2', '26.1-26.3', '1.21.10-26.3', '1.21.11-26.3', '1.21.1-26.1.2', '1.21.1-26.2'],
    '26.2':    ['26.2', '26.2-26.3', '26.1-26.3', '1.21.10-26.3', '1.21.11-26.3', '1.21.1-26.2'],
    '26.3':    ['26.3', '26.2-26.3', '26.1-26.3', '1.21.10-26.3', '1.21.11-26.3']
]
versionSources[minecraft_version].each { folder ->
    sourceSets.main.java.srcDir "src/versions/${folder}/java"
    sourceSets.main.resources.srcDir "src/versions/${folder}/resources"
}

if (minecraft_version == '1.21.1') {
    sourceSets.test.java.srcDirs 'src/test/1.21.1/java', 'src/verification/1.21.1/quad/java',
            'src/verification/1.21.1/experimental/occlusion/java'
}

tasks.withType(JavaCompile).configureEach { options.release = javaRelease }
def generateModIdentity = tasks.register('generateModIdentity', Sync) {
    def identity = [mod_id: mod_id, mod_name: mod_name, previous_mod_id: previous_mod_id, legacy_mod_id: legacy_mod_id]
    inputs.properties(identity)
    from('gradle/templates') { expand(identity) }
    into layout.buildDirectory.dir('generated/modIdentity')
}
sourceSets.main.java.srcDir generateModIdentity
java { withSourcesJar() }
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath
test { useJUnitPlatform() }
